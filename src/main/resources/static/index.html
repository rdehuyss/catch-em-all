<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java-Dex Capture</title>
    <link rel="stylesheet" href="capture.css">
</head>
<body>
<header>
    <h1>Java-Dex Capture</h1>
    <p>Step 1 of 4: hold up each card and take ~10 pictures per card (vary angle and distance).</p>
</header>

<main>
    <section class="camera">
        <div class="camera-wrap">
            <video id="video" autoplay playsinline muted></video>
            <div class="guide"><span class="guide-label">keep the card inside this square</span></div>
        </div>
        <canvas id="canvas" hidden></canvas>
        <div class="controls">
            <button id="captureBtn" disabled>Capture for selected card</button>
            <span id="status">Starting camera…</span>
        </div>
    </section>

    <section class="cards">
        <h2>Pick the card you are holding up</h2>
        <div id="cardGrid" class="grid"></div>
    </section>
</main>

<script src="capture.js"></script>
</body>
</html>
